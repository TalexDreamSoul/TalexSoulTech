# TalexSoulTech runtime settings
Settings:
  prefix: "Talexs"
  mysql:
    # Set true only after supplying production credentials on the server.
    enabled: false
    ip: "127.0.0.1"
    port: 3306
    user: ""
    pass: ""
    db: "soul_tech"

  cloud:
    # Pairing targets the official HTTPS control plane by default; sync remains disabled until pairing succeeds.
    enabled: false
    api-base: "https://soultech.tagzxia.com"
    server-id: ""
    api-key: ""
    sync-interval-seconds: 300
    sequence: 0

  telemetry:
    # 关闭后插件停止统计并且不再向云端上报任何玩法计数；仅聚合数量，不含任何玩家身份数据。
    enabled: true

  extensions:
    enabled: true
    refresh-interval-seconds: 60
    max-source-bytes: 131072
    callback-budget-millis: 50
Features:
  progression:
    # 学科解锁消耗玩家当前经验等级；高级学科仍需先解锁其前置学科。
    category-unlock-levels:
      st_base: 1
      st_material: 3
      st_sapling: 3
      st_chestplates: 5
      st_industry: 8
      st_magic: 8
      st_space: 16
      st_gravitation: 24
  wilderness:
    # 关闭时仅停止新矿脉与怪物强化；已有 v2 索引的矿脉继续保持交互。
    enabled: false
    worlds:
      - world
    ore:
      # 关闭时仅停止新矿脉生成；已有 v2 索引矿脉仍会被识别。
      enabled: true
      min-y: -32
      max-y: 24
      attempts-per-chunk: 3
      vein-size: 3
      max-blocks-per-chunk: 8
      material: RAW_GOLD_BLOCK
      replaceable:
        - STONE
        - DEEPSLATE
      drop:
        material: GOLD_NUGGET
        amount: 1
        experience: 1
    mobs:
      enabled: true
      chance: 0.04
      allowed-types:
        - ZOMBIE
        - SKELETON
      max-health-multiplier: 1.15
      attack-damage-multiplier: 1.10
      movement-speed-multiplier: 1.05
      max-health-cap: 40.0
      attack-damage-cap: 12.0
      movement-speed-cap: 0.4
      name: "&6荒野 %type%"
      name-visible: false
      drop:
        material: GOLD_NUGGET
        amount: 1
  storage:
    enabled: true
    item-models:
      enabled: true
    copper_box:
      enabled: true
    iron_box:
      enabled: true
    void_box:
      enabled: true
